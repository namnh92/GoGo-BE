name: CI

on:
  pull_request:
  push:
    branches: [develop, master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      # Contract drift gate (QP-002): the committed generated client must
      # match the OpenAPI spec; regeneration diff fails the build.
      - run: pnpm api:check
      # Supply-chain gate: critical advisories in prod deps fail the build.
      - run: pnpm audit --prod --audit-level critical
      - run: pnpm test
      - run: pnpm build
      # Published contract artifacts (FND-005): consumers download these.
      - uses: actions/upload-artifact@v4
        with:
          name: gogo-api-contract
          path: |
            openapi/gogo.v1.yaml
            openapi/gogo.v1.d.ts

  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Testcontainers spins up postgis/redis on the runner's Docker daemon.
      - run: pnpm test:integration
