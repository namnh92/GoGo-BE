name: CI

on:
  pull_request:
  push:
    branches: [develop, master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      # Contract drift gate (QP-002): the committed generated client must
      # match the OpenAPI spec; regeneration diff fails the build.
      - run: pnpm api:check
      # Coverage gate: every route the app serves must be in the spec, and
      # every documented path must exist — the Mobile team reads /v1/docs.
      - run: pnpm api:routes
      # Supply-chain gate: critical advisories in prod deps fail the build.
      - run: pnpm audit --prod --audit-level critical
      - run: pnpm test
      - run: pnpm build
      # Published contract artifacts (FND-005): consumers download these.
      - uses: actions/upload-artifact@v4
        with:
          name: gogo-api-contract
          path: |
            openapi/gogo.v1.yaml
            openapi/gogo.v1.d.ts

  # BE-BFF-012: no breaking /v1 change lands without the policy being invoked.
  # oasdiff compares the PR spec against the base branch spec.
  contract-compat:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # The action runs in a container with only the workspace mounted, so the
      # base spec must live inside the workspace — /tmp is not shared.
      - name: Extract base spec
        run: |
          git show "origin/${{ github.base_ref }}:openapi/gogo.v1.yaml" > .oasdiff-base.yaml \
            || cp openapi/gogo.v1.yaml .oasdiff-base.yaml
      - name: Breaking-change gate
        uses: oasdiff/oasdiff-action/breaking@v0.0.21
        with:
          base: .oasdiff-base.yaml
          revision: openapi/gogo.v1.yaml
          fail-on: ERR

  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Testcontainers spins up postgis/redis on the runner's Docker daemon.
      - run: pnpm test:integration
