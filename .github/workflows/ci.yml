name: CI

on:
  pull_request:
  push:
    branches: [develop, master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Type-aware eslint over the whole repo sits just above Node's default
      # heap on this runner (local: OOM at 2048 MB, ok at 2560; #699).
      - run: pnpm lint
        env:
          NODE_OPTIONS: --max-old-space-size=4096
      - run: pnpm format:check
      - run: pnpm typecheck
      # Contract drift gate (QP-002): the committed generated client must
      # match the OpenAPI spec; regeneration diff fails the build.
      - run: pnpm api:check
      # Coverage gate: every route the app serves must be in the spec, and
      # every documented path must exist — the Mobile team reads /v1/docs.
      - run: pnpm api:routes
      # FND-003: a package that reaches back into an app cannot be published —
      # the break would show up in a consumer's build, not in ours.
      - run: pnpm check:boundaries
      # Supply-chain gate: critical advisories in prod deps fail the build.
      - run: pnpm audit --prod --audit-level critical
      - run: pnpm test
      - run: pnpm build
      # Published contract artifacts (FND-003/005): consumers download these.
      # The manifest carries the contract version, the commit and a checksum
      # per file, so a consumer can verify what it generated its client from
      # rather than trusting a version string.
      - run: pnpm artifacts
      - uses: actions/upload-artifact@v4
        with:
          name: gogo-contract
          path: artifacts/

  # BE-BFF-012: no breaking /v1 change lands without the policy being invoked.
  # oasdiff compares the PR spec against the base branch spec.
  contract-compat:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # The action runs in a container with only the workspace mounted, so the
      # base spec must live inside the workspace — /tmp is not shared.
      - name: Extract base spec
        run: |
          git show "origin/${{ github.base_ref }}:openapi/gogo.v1.yaml" > .oasdiff-base.yaml \
            || cp openapi/gogo.v1.yaml .oasdiff-base.yaml
      # GoGo-BE#449: consumers vendor this file and compare their copy against the
      # version it declares, so a changed contract under an unchanged version tells
      # them nothing moved. oasdiff catches breaking changes; this catches silent
      # ones.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Contract version gate
        run: pnpm api:version .oasdiff-base.yaml openapi/gogo.v1.yaml

      # GoGo-BE#694: the gate judges the report, so an owner-decided breaking
      # change can be green on a head instead of being merged past a red job.
      # oasdiff only measures here; the policy lives in the script below.
      - name: Breaking-change gate
        id: oasdiff
        continue-on-error: true
        uses: oasdiff/oasdiff-action/breaking@v0.0.21
        with:
          base: .oasdiff-base.yaml
          revision: openapi/gogo.v1.yaml
          fail-on: ERR
          output-to-file: .oasdiff-report.txt
      - name: Breaking-change policy
        run: >-
          SWC_NODE_PROJECT=./tsconfig.base.json node -r @swc-node/register
          scripts/check-contract-compat.ts
          .oasdiff-base.yaml openapi/gogo.v1.yaml .oasdiff-report.txt
          ${{ steps.oasdiff.outcome }}

      # The exception in .github/oasdiff-exceptions.json is only worth anything
      # if it still matches the transition it was written for. Replaying that
      # transition keeps the entry honest: edit the hashes or the diagnostic and
      # this step goes red, on every PR, not on the one that needed it.
      - name: Recorded exception still matches its own transition (#694)
        run: |
          git show e1e390d711973b541a5eb7ffde8175795b0997b6:openapi/gogo.v1.yaml > .oasdiff-hist-base.yaml
          git show 5bb32429c2e6d6fc60d4903cd0db228cba4eaf60:openapi/gogo.v1.yaml > .oasdiff-hist-head.yaml
      - name: Breaking-change gate on the recorded transition (#694)
        id: oasdiff-history
        continue-on-error: true
        uses: oasdiff/oasdiff-action/breaking@v0.0.21
        with:
          base: .oasdiff-hist-base.yaml
          revision: .oasdiff-hist-head.yaml
          fail-on: ERR
          output-to-file: .oasdiff-history-report.txt
      - name: Breaking-change policy on the recorded transition (#694)
        run: >-
          SWC_NODE_PROJECT=./tsconfig.base.json node -r @swc-node/register
          scripts/check-contract-compat.ts
          .oasdiff-hist-base.yaml .oasdiff-hist-head.yaml .oasdiff-history-report.txt
          ${{ steps.oasdiff-history.outcome }}

  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Testcontainers spins up postgis/redis on the runner's Docker daemon.
      - run: pnpm test:integration

  # #487 — the one defect class no other job here can see. Every test above runs
  # against the checkout, where `resources/` is always present; the runtime image
  # did not carry it, and DEV answered every administrative import with ENOENT
  # after a deploy whose CI was fully green. This job builds the production image
  # and asks PinnedSnapshotReader, inside it, with no bind mount, to resolve and
  # checksum the pinned snapshots.
  packaging:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: ./scripts/ci/docker-resources.test.sh
