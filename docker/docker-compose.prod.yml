# Deployed application stack.
#
# Default services are caddy, api and worker; `migrate` runs as a one-off job.
#
# PostgreSQL, Redis and the backup sidecar live in
# docker-compose.self-hosted.yml and are NOT part of the target architecture —
# every environment uses managed services
# (GoGo-Remote-First-Multi-Environment-Infrastructure-Spec.md §13).
#
# They are a separate file rather than a profile because Compose interpolates
# the whole file before it filters by profile: `${POSTGRES_PASSWORD:?}` in a
# profile-gated service aborts a deploy that never intended to run PostgreSQL.
#
# Deploy:
#   docker compose -f docker/docker-compose.prod.yml --env-file .env.prod up -d
#
# Migrate:
#   docker compose -f docker/docker-compose.prod.yml --env-file .env.prod run --rm migrate
#
# Self-hosted data tier, for a host with no managed services available. A
# transitional mode, never the target — nightly pg_dump does not meet the
# production RPO in GOGO_SRS.md §10.1:
#
#   docker compose -f docker/docker-compose.prod.yml \
#                  -f docker/docker-compose.self-hosted.yml \
#                  --env-file .env.prod up -d

services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in .env.prod}
      ACME_EMAIL: ${ACME_EMAIL:?set ACME_EMAIL}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api

  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    restart: unless-stopped
    environment:
      PROCESS: api
      NODE_ENV: production
      API_PORT: '3000'
      # Only Caddy (the single hop in front) may set X-Forwarded-For. The API
      # port is deliberately not published, so nothing else can reach it.
      TRUST_PROXY: '1'
    env_file:
      - ../.env.prod
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:3000/v1/health']
      interval: 30s
      timeout: 5s
      retries: 3

  worker:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    restart: unless-stopped
    environment:
      PROCESS: worker
      NODE_ENV: production
    env_file:
      - ../.env.prod

  migrate:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    profiles: ['tools']
    environment:
      PROCESS: migrate
    env_file:
      - ../.env.prod

volumes:
  caddy_data:
  caddy_config:
