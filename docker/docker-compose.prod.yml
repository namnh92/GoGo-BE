# Deployed application stack: api, worker and the one-off migrate job.
#
# The edge is not here. A host that accepts inbound connections uses
# docker-compose.edge-caddy.yml; one that does not uses
# docker-compose.edge-tunnel.yml. Which of those applies is a fact about the
# host, and GoGo-Infra ADR-0004 says the host is an implementation detail — so
# it cannot be baked into the stack every environment shares.
#
# PostgreSQL, Redis and the backup sidecar live in
# docker-compose.self-hosted.yml and are NOT part of the target architecture —
# every environment uses managed services
# (GoGo-Remote-First-Multi-Environment-Infrastructure-Spec.md §13).
#
# Separate files rather than profiles, because Compose interpolates the whole
# file before it filters by profile: a `${VAR:?}` in a profile-gated service
# aborts a deploy that never intended to run it.
#
# ENV_FILE names the runtime env file on the host, relative to the repository
# root, and defaults to .env.prod. The deploy sets it per environment.
#
# --env-file and env_file: are different things and both are needed: the flag
# supplies variables for interpolating this file, the key puts them inside the
# containers.
#
# Deploy (host with open ports):
#   ENV_FILE=.env.prod docker compose -f docker/docker-compose.prod.yml \
#     -f docker/docker-compose.edge-caddy.yml --env-file .env.prod up -d
#
# Deploy (host behind a tunnel):
#   ENV_FILE=.env.dev docker compose -f docker/docker-compose.prod.yml \
#     -f docker/docker-compose.edge-tunnel.yml --env-file .env.dev up -d
#
# Migrate:
#   ENV_FILE=.env.prod docker compose -f docker/docker-compose.prod.yml \
#     --env-file .env.prod run --rm migrate

services:
  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    restart: unless-stopped
    environment:
      PROCESS: api
      NODE_ENV: production
      API_PORT: '3000'
      # Only Caddy (the single hop in front) may set X-Forwarded-For. The API
      # port is deliberately not published, so nothing else can reach it.
      TRUST_PROXY: '1'
    env_file:
      - ../${ENV_FILE:-.env.prod}
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:3000/v1/health']
      interval: 30s
      timeout: 5s
      retries: 3

  worker:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    restart: unless-stopped
    environment:
      PROCESS: worker
      NODE_ENV: production
      WORKER_METRICS_PORT: '9101'
    env_file:
      - ../${ENV_FILE:-.env.prod}
    # #318 — the worker's scrape target. `expose`, never `ports`: a collector
    # on this compose network reaches it, the host and the Internet do not.
    # Publishing this port would put every internal series one curl away, and
    # the bearer token is the second lock, not the first.
    expose:
      - '9101'

  migrate:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    profiles: ['tools']
    environment:
      PROCESS: migrate
    env_file:
      - ../${ENV_FILE:-.env.prod}

  # Reference data and, outside production, a bootstrap CMS admin. Behind the
  # same `tools` profile as migrate: `up` must never run it, because seeding a
  # shared environment on every deploy overwrites whatever someone was testing.
  #
  # APP_ENV decides whether the bootstrap admin is created at all, and it
  # defaults to dev when unset. Whoever runs this passes it deliberately —
  # `docker compose run --rm -e APP_ENV=prod seed` — rather than relying on the
  # env file carrying it.
  seed:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    profiles: ['tools']
    environment:
      PROCESS: seed
    env_file:
      - ../${ENV_FILE:-.env.prod}
