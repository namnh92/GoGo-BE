# Nothing here starts by default.
#
# DEV points at Neon and Upstash — `pnpm secrets:pull` writes the connection
# strings — so a local PostgreSQL is not just unnecessary, it is a hazard: a
# developer running it works against a different database from everyone else,
# and nothing says so.
#
# Use it deliberately, for offline work, infrastructure debugging or CI:
#   docker compose --profile full-local up
services:
  postgres:
    profiles: ['full-local']
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: gogo
      POSTGRES_PASSWORD: gogo
      POSTGRES_DB: gogo
    ports:
      # 5433 host-side to avoid colliding with a locally installed postgres
      - '5433:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U gogo -d gogo']
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    profiles: ['full-local']
    image: redis:7-alpine
    ports:
      # 6380 host-side to avoid colliding with other local redis instances
      - '6380:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
