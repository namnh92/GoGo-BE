services:
  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: gogo
      POSTGRES_PASSWORD: gogo
      POSTGRES_DB: gogo
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U gogo -d gogo']
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
