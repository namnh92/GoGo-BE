        endsAt: { type: string, format: date-time }
        taxonomyIds:
          type: array
          maxItems: 30
          items: { type: string, format: uuid }
        placeIds:
          type: array
          maxItems: 100
          description: Ordered — the index becomes the stored position.
          items: { type: string, format: uuid }

    CmsRecommendationPatch:
      type: object
      description: Omitted fields are left alone; a sent list replaces that list wholesale.
      properties:
        internalName: { type: string, maxLength: 120 }
        title: { type: string, maxLength: 120 }
        subtitle: { type: string, maxLength: 200 }
        description: { type: string, maxLength: 2000 }
        locale: { type: string, maxLength: 8 }
        audience: { $ref: '#/components/schemas/ContentAudience' }
        areaKey: { type: string, maxLength: 64 }
        priority: { type: integer, minimum: 0, maximum: 1000 }
        startsAt: { type: string, format: date-time }
        endsAt: { type: string, format: date-time }
        taxonomyIds:
          type: array
          maxItems: 30
          items: { type: string, format: uuid }
        placeIds:
          type: array
          maxItems: 100
          items: { type: string, format: uuid }

    SafetyRuleType:
      type: string
      enum:
        [
          spam,
          abusive_content,
          blocked_words,
          review_abuse,
          user_abuse,
          repeated_reports,
          rate_limit,
        ]

    SafetyRuleTrigger:
      type: string
      enum:
        [
          review_created,
          review_updated,
          report_created,
          checkin_created,
          place_submitted,
          user_registered,
        ]

    SafetyRuleAction:
      type: string
      enum: [flag_for_review, auto_hide, require_moderation, suspend_user, block_action]
      description: >
        `suspend_user` acts on a person with no human in the loop, so it is
        available only to rule types that are about that person's conduct and
        only at `high` severity or above.

    SafetyRuleSeverity:
      type: string
      enum: [low, medium, high, critical]

    SafetyRuleStatus:
      type: string
      enum: [draft, active, disabled]

    CmsSafetyRuleConditions:
      type: object
      description: >
        A closed shape chosen by `ruleType`, never an expression. Unknown keys
        are rejected on write rather than stored and never read.


        `blocked_words`: `terms[]`, `matchMode` (exact | substring),
        `caseSensitive`.

        `spam`: `maxLinks`, `maxDuplicatesPerWindow`, `windowHours`,
        `minAccountAgeHours` — at least one of the first two.

        `abusive_content`: `terms[]`, `minReports`, `windowHours`.

        `review_abuse`: `maxReviewsPerWindow`, `windowHours`,
        `maxReviewsPerPlace`.

        `user_abuse`: `maxReportsAgainstUser`, `windowHours`, `upheldOnly`.

        `repeated_reports`: `minReports`, `windowHours`, `distinctReporters`.

        `rate_limit`: `action` (review_create | report_create | checkin_create |
        place_submit | room_join), `limit`, `windowSeconds`.
      additionalProperties: true

    CmsSafetyRule:
      type: object
      required:
        [
          id,
          name,
          ruleType,
          trigger,
          conditions,
          action,
          severity,
          status,
          priority,
          reasonCode,
          createdAt,
          updatedAt,
        ]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        description: { type: string }
        ruleType: { $ref: '#/components/schemas/SafetyRuleType' }
        trigger: { $ref: '#/components/schemas/SafetyRuleTrigger' }
        conditions: { $ref: '#/components/schemas/CmsSafetyRuleConditions' }
        action: { $ref: '#/components/schemas/SafetyRuleAction' }
        severity: { $ref: '#/components/schemas/SafetyRuleSeverity' }
        status: { $ref: '#/components/schemas/SafetyRuleStatus' }
        priority:
          type: integer
          description: >
            Lower runs first, so two rules matching one event resolve the same
            way every time rather than by insertion order.
        reasonCode:
          type: string
          description: >
            Stamped on every decision this rule causes, so an automated action
            can be traced back by a person reviewing it.
        createdBy:
          oneOf:
            - { $ref: '#/components/schemas/CmsAdminRef' }
            - { type: 'null' }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    CmsSafetyRulePage:
      type: object
      required: [items, nextCursor, totalCount]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/CmsSafetyRule' }
        nextCursor: { type: [string, 'null'] }
        totalCount: { type: integer }

    CmsSafetyRuleCreate:
      type: object
      required: [name, ruleType, trigger, action, reasonCode]
      properties:
        name: { type: string, minLength: 3, maxLength: 120 }
        description: { type: string, maxLength: 1000 }
        ruleType: { $ref: '#/components/schemas/SafetyRuleType' }
        trigger: { $ref: '#/components/schemas/SafetyRuleTrigger' }
        conditions: { $ref: '#/components/schemas/CmsSafetyRuleConditions' }
        action: { $ref: '#/components/schemas/SafetyRuleAction' }
        severity: { $ref: '#/components/schemas/SafetyRuleSeverity' }
        priority: { type: integer, minimum: 0, maximum: 1000 }
        reasonCode: { type: string, pattern: '^[a-z][a-z0-9_]{2,63}$' }

    CmsSafetyRulePatch:
      type: object
      description: '`ruleType` is immutable; it decides which condition schema applies.'
      properties:
        name: { type: string, minLength: 3, maxLength: 120 }
        description: { type: string, maxLength: 1000 }
        trigger: { $ref: '#/components/schemas/SafetyRuleTrigger' }
        conditions: { $ref: '#/components/schemas/CmsSafetyRuleConditions' }
        action: { $ref: '#/components/schemas/SafetyRuleAction' }
        severity: { $ref: '#/components/schemas/SafetyRuleSeverity' }
        priority: { type: integer, minimum: 0, maximum: 1000 }
        reasonCode: { type: string, pattern: '^[a-z][a-z0-9_]{2,63}$' }

    BannerPlacement:
      type: string
      enum: [home_hero, home_secondary]
      description: Stable key; the label resolves client-side.

    BannerStatus:
      type: string
      enum: [draft, scheduled, published, archived]
      description: The lifecycle a person controls. `expired` is not settable.

    BannerEffectiveStatus:
      type: string
      enum: [draft, scheduled, published, archived, expired]
      description: >
        What the banner is right now. `expired` is computed by the server from
        the end time on every read, never stored — a stored copy would be wrong
        between the moment the window closes and whatever noticed.

    BannerDestination:
      type: string
      enum: [none, place, recommendation, plan_template, campaign, external_url]

    CmsBanner:
      type: object
      required:
        [
          id,
          name,
          imageKey,
          imageUrl,
          destinationType,
          placement,
          priority,
          status,
          lifecycleStatus,
          createdAt,
          updatedAt,
        ]
      properties:
        id: { type: string, format: uuid }
        name: { type: string, description: The editorial name. }
        imageKey: { type: string }
        imageUrl:
          type: [string, 'null']
          description: >
            Where the image is readable. Null until media hosting is configured,
            rather than a URL that would 404.
        title: { type: string }
        subtitle: { type: string }
        ctaLabel: { type: string }
        destinationType: { $ref: '#/components/schemas/BannerDestination' }
        destinationValue: { type: string }
        audience: { $ref: '#/components/schemas/ContentAudience' }
        placement: { $ref: '#/components/schemas/BannerPlacement' }
        startsAt: { type: string, format: date-time }
        endsAt: { type: string, format: date-time }
        priority:
          type: integer
          description: Higher first, between banners competing for one placement.
        status: { $ref: '#/components/schemas/BannerEffectiveStatus' }
        lifecycleStatus:
          allOf:
            - $ref: '#/components/schemas/BannerStatus'
          description: What a person set, as opposed to what the clock made of it.
        createdByAdminId: { type: string, format: uuid }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    CmsBannerPage:
      type: object
      required: [items, nextCursor, totalCount]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/CmsBanner' }
        nextCursor: { type: [string, 'null'] }
        totalCount: { type: integer }

    CmsBannerCreate:
      type: object
      required: [name, imageKey, placement]
      properties:
        name: { type: string, minLength: 3, maxLength: 120 }
        imageKey:
          type: string
          maxLength: 300
          description: From `POST /cms/uploads`, purpose `banner_image`.
        title: { type: string, maxLength: 120 }
        subtitle: { type: string, maxLength: 200 }
        ctaLabel: { type: string, maxLength: 40 }
        destinationType: { $ref: '#/components/schemas/BannerDestination' }
        destinationValue:
          type: string
          maxLength: 2000
          description: Required unless `destinationType` is `none`, which takes nothing.
        audience: { $ref: '#/components/schemas/ContentAudience' }
        placement: { $ref: '#/components/schemas/BannerPlacement' }
        startsAt: { type: string, format: date-time }
        endsAt: { type: string, format: date-time }
        priority: { type: integer, minimum: 0, maximum: 1000 }

    CmsBannerPatch:
      type: object
      description: Omitted fields are left alone.
      properties:
        name: { type: string, minLength: 3, maxLength: 120 }
        imageKey: { type: string, maxLength: 300 }
        title: { type: string, maxLength: 120 }
        subtitle: { type: string, maxLength: 200 }
        ctaLabel: { type: string, maxLength: 40 }
        destinationType: { $ref: '#/components/schemas/BannerDestination' }
        destinationValue: { type: string, maxLength: 2000 }
        audience: { $ref: '#/components/schemas/ContentAudience' }
        placement: { $ref: '#/components/schemas/BannerPlacement' }
        startsAt: { type: string, format: date-time }
        endsAt: { type: string, format: date-time }
        priority: { type: integer, minimum: 0, maximum: 1000 }

    CampaignStatus:
      type: string
      enum: [draft, scheduled, sending, sent, cancelled, failed]
      description: >
        `sending` has no way back — once the worker has started handing messages
        to the provider, some are already delivered.

    CampaignAudience:
      type: string
      enum: [all, couple, group, platform]
      description: >
        Only what the backend can resolve from data it holds. `city`,
        `app_version` and `custom_segment` from the mockup are absent on
        purpose: nothing stores a user's city or their app version, and a
        campaign aimed at a segment the server has to guess at reaches the wrong
        people — the one failure with no undo.

    CampaignDestination:
      type: string
      enum: [home, place, recommendation, plan_template, saved, external_url]
      description: >
        `plan_template` rather than `plan`: a campaign points every recipient at
        the same thing, and a plan belongs to one room.

    CmsCampaign:
      type: object
      required:
        [
          id,
          name,
          title,
          body,
          audienceType,
          audienceFilter,
          destinationType,
          status,
          sentCount,
          failedCount,
          createdAt,
          updatedAt,
        ]
      properties:
        id: { type: string, format: uuid }
        name:
          type: string
          description: The editorial name. `title` is what lands on a screen.
        title: { type: string }
        body: { type: string }
        imageKey:
          type: string
          description: Key from `POST /cms/uploads`, purpose `campaign_image`.
        ctaLabel: { type: string }
        audienceType: { $ref: '#/components/schemas/CampaignAudience' }
        audienceFilter:
          type: object
          description: 'Closed per audience type. `platform` takes `{ platform }`; the rest take `{}`.'
          additionalProperties: true
        destinationType: { $ref: '#/components/schemas/CampaignDestination' }
        destinationValue: { type: string }
        status: { $ref: '#/components/schemas/CampaignStatus' }
        scheduledAt: { type: string, format: date-time }
        startedAt: { type: string, format: date-time }
        completedAt: { type: string, format: date-time }
        recipientCount:
          type: integer
          description: Resolved at send time, not at schedule time.
        sentCount:
          type: integer
          description: >
            How many the provider accepted. Not "seen", and not a guarantee of
            delivery to a device.
        failedCount: { type: integer }
        lastError: { type: string }
        testSendRequestedAt: { type: string, format: date-time }
        testSendCompletedAt: { type: string, format: date-time }
        createdByAdminId: { type: string, format: uuid }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    CmsCampaignPage:
      type: object
      required: [items, nextCursor, totalCount]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/CmsCampaign' }
        nextCursor: { type: [string, 'null'] }
        totalCount: { type: integer }

    CmsCampaignAudienceEstimate:
      type: object
      required: [campaignId, audienceType, estimatedRecipients, estimatedAt]
      properties:
        campaignId: { type: string, format: uuid }
        audienceType: { $ref: '#/components/schemas/CampaignAudience' }
        estimatedRecipients:
          type: integer
          description: Accounts with a registered device that match right now.
        estimatedAt: { type: string, format: date-time }

    CmsCampaignCreate:
      type: object
      required: [name, title, body, audienceType]
      properties:
        name: { type: string, minLength: 3, maxLength: 120 }
        title: { type: string, maxLength: 80 }
        body: { type: string, maxLength: 300 }
        imageKey: { type: string, maxLength: 300 }
        ctaLabel: { type: string, maxLength: 40 }
        audienceType: { $ref: '#/components/schemas/CampaignAudience' }
        audienceFilter: { type: object, additionalProperties: true }
        destinationType: { $ref: '#/components/schemas/CampaignDestination' }
        destinationValue:
          type: string
          maxLength: 2000
          description: >
            Required for `place`, `recommendation`, `plan_template` and
            `external_url`; forbidden for `home` and `saved`.

    CmsCampaignPatch:
      type: object
      description: Editable only while nothing has been sent.
      properties:
        name: { type: string, minLength: 3, maxLength: 120 }
        title: { type: string, maxLength: 80 }
        body: { type: string, maxLength: 300 }
        imageKey: { type: string, maxLength: 300 }
        ctaLabel: { type: string, maxLength: 40 }
        audienceType: { $ref: '#/components/schemas/CampaignAudience' }
        audienceFilter: { type: object, additionalProperties: true }
        destinationType: { $ref: '#/components/schemas/CampaignDestination' }
        destinationValue: { type: string, maxLength: 2000 }

    CmsUpload:
      type: object
      required: [id, key, uploadUrl, expiresAt, maxBytes, contentType, readUrl]
      properties:
        id: { type: string, format: uuid }
        key:
          type: string
          description: >
            Server-generated — actor and a UUID, never anything the client
            supplied — so a key cannot be steered at another object.
        uploadUrl:
          type: string
          description: Presigned PUT. Signed for this key and this content type, and it expires.
        expiresAt: { type: string, format: date-time }
        maxBytes: { type: integer }
        contentType: { type: string }
        readUrl:
          type: [string, 'null']
          description: >
            Where the object will be readable once uploaded. Null until media
            hosting is configured — an honest absence rather than a URL that
            would 404.

    CmsAuditEntry:
      type: object
      required: [id, action, actorType, resourceType, resourceId, occurredAt, breakGlass]
      properties:
        id: { type: string, format: uuid }
        action: { type: string }
        actorType: { type: string, enum: [admin, user, system] }
        actorId: { type: string, format: uuid }
        actorRole:
          type: string
          enum: [editor, moderator, ops_admin, super_admin]
          description: >
            The role at read time, joined for incident review. Nothing else
            about the account is exposed.
        resourceType: { type: string }
        resourceId: { type: string }
        occurredAt: { type: string, format: date-time }
        diff:
          description: Before/after of the sensitive write, PII-minimised at write time.
        reason:
          type: string
          description: Lifted out of the diff for the writes that require one.
        breakGlass:
          type: boolean
          description: True for emergency takedown — the write that bypassed the normal role for this action.
        requestId: { type: string }
        ipAddress:
          type: string
          description: >
            Staff IP, recorded for admin actions only and returned only to
            ops_admin and above. It exists to tell "that admin did it" apart
            from "that admin's account was taken over"; that justification does
            not extend to the roles that do not run incident review, so it is
            omitted for them, and it must not appear in any other response,
            log line or analytics event.
        authorizationPath:
          type: string
          enum: [exact_role, rank_read, super_admin_bypass]
          description: Which rule authorized the write. `super_admin_bypass` means every other role would have been refused.

    CmsAuditPage:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/CmsAuditEntry' }
        nextCursor:
          type: [string, 'null']
          description: Keyset cursor over (occurredAt, id); the log is appended to while it is read.

    CmsModerationCounts:
      type: object
      required: [reviews, reports, checkins, communityPlaces, total]
      description: >
        Counted over the whole backlog, not over a returned page. The console
        used to sum four array lengths, which was only correct while every queue
        fitted in one page.
      properties:
        reviews: { type: integer, description: Reviews in `pending`. }
        reports: { type: integer, description: Reports in `open`. }
        checkins: { type: integer, description: Check-ins in `pending`. }
        communityPlaces: { type: integer, description: Places in `community_submitted`. }
        total: { type: integer }

    CmsModerationPageMeta:
      type: object
      required: [nextCursor, totalCount]
      properties:
        nextCursor:
          type: [string, 'null']
          description: >
            Keyset cursor over (createdAt, id). Null only when there is
            genuinely nothing more.
        totalCount:
          type: integer
          description: Rows matching the filter, not rows in this page.

    CmsModerationReview:
      type: object
      required: [id, status, rating, authorUserId, openReportCount, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        status: { type: string, enum: [pending, published, rejected, removed, hidden] }
        rating: { type: integer, minimum: 1, maximum: 5 }
        text: { type: string }
        placeId: { type: string, format: uuid }
        placeName: { type: string }
        planId: { type: string, format: uuid }
        authorUserId: { type: string, format: uuid }
        authorDisplayName:
          type: string
          description: The name shown on the review. Email and phone are never returned here.
        openReportCount:
          type: integer
          description: Undecided reports pointing at this review.
        moderatedByAdminId: { type: string, format: uuid }
        moderationReason: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    CmsModerationReviewPage:
      allOf:
        - $ref: '#/components/schemas/CmsModerationPageMeta'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items: { $ref: '#/components/schemas/CmsModerationReview' }

    CmsModerationReport:
      type: object
      required: [id, status, targetType, targetId, reasonCode, reporterKind, createdAt]
      properties:
        id: { type: string, format: uuid }
        status: { type: string, enum: [open, actioned, dismissed] }
        targetType: { type: string, enum: [place, review, member] }
        targetId: { type: string, format: uuid }
        reasonCode: { type: string }
        note: { type: string }
        reporterKind:
          type: string
          enum: [user, guest, anonymous]
          description: >
            Where the report came from. The guest session id is internal and is
            not returned.
        reporterUserId: { type: string, format: uuid }
        decidedByAdminId: { type: string, format: uuid }
        decisionReason: { type: string }
        decidedAt: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }

    CmsModerationReportPage:
      allOf:
        - $ref: '#/components/schemas/CmsModerationPageMeta'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items: { $ref: '#/components/schemas/CmsModerationReport' }

    CmsModerationCheckin:
      type: object
      required: [id, moderation, tags, photoCount, hasBill, planStopId, memberId, createdAt]
      properties:
        id: { type: string, format: uuid }
        moderation: { type: string, enum: [pending, approved, rejected] }
        rating: { type: integer, minimum: 1, maximum: 5 }
        note: { type: string }
        tags:
          type: array
          items: { type: string }
          description: Stable `checkin_tag` taxonomy keys; labels resolve client-side.
        photoCount: { type: integer }
        hasBill:
          type: boolean
          description: A bill total is present, which FR-PLAN-009 only allows with its photo.
        planStopId: { type: string, format: uuid }
        placeId: { type: string, format: uuid }
        placeName: { type: string }
        memberId: { type: string, format: uuid }
        createdAt: { type: string, format: date-time }

    CmsModerationCheckinPage:
      allOf:
        - $ref: '#/components/schemas/CmsModerationPageMeta'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items: { $ref: '#/components/schemas/CmsModerationCheckin' }

    CmsCommunityPlace:
      type: object
      required: [id, name, createdAt]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        addressText: { type: string }
        areaKey: { type: string }
        createdAt: { type: string, format: date-time }

    CmsCommunityPlacePage:
      allOf:
        - $ref: '#/components/schemas/CmsModerationPageMeta'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items: { $ref: '#/components/schemas/CmsCommunityPlace' }

    RoomEvent:
      type: object
      description: >
        The domain-event envelope from the api-contract rules, unchanged.
        Field names are snake_case here because that is the event convention,
        not the REST DTO convention.
      required:
        [event_id, event_type, event_version, occurred_at, resource_type, resource_id, payload]
      properties:
        event_id: { type: string, format: uuid }
        event_type:
          type: string
          enum:
            - room.status_changed
            - participant.joined
            - participant.left
            - participant.selection_changed
            - matching.started
            - matching.completed
            - matching.failed
            - suggestions.generated
            - suggestions.updated
            - vote.changed
            - plan.updated
            - resync
            - heartbeat
        event_version: { type: integer }
        occurred_at: { type: string, format: date-time }
        actor_id:
          type: [string, 'null']
          description: >
            Pseudonymous. Where a participant is named it is by room-scoped
            member id, which does not carry an account across rooms.
        resource_type: { type: string }
        resource_id: { type: string }
        correlation_id: { type: [string, 'null'] }
        payload_schema_version: { type: integer }
        payload:
          type: object
          description: >
            Facts, never composed copy. Carries the version a client should
            compare against — `constraintVersion` for suggestions, `version`
            for a plan — so a stale event is distinguishable from a fresh one.

    CmsSearchAnalytics:
      type: object
      required: [days, totals, trend, worstQueries, hiddenBelowFloor]
      properties:
        days: { type: integer }
        totals:
          type: object
          required: [searches, zeroResults, zeroResultRate, avgResults, avgLatencyMs]
          properties:
            searches: { type: integer }
            zeroResults: { type: integer }
            zeroResultRate: { type: number }
            avgResults: { type: number }
            avgLatencyMs: { type: integer }
        trend:
          type: array
          items:
            type: object
            required: [day, searches, zeroResults, zeroResultRate]
            properties:
              day: { type: string, format: date }
              searches: { type: integer }
              zeroResults: { type: integer }
              zeroResultRate: { type: number }
        worstQueries:
          type: array
          description: Only terms at or above the visibility floor.
          items:
            type: object
            required: [query, searches, zeroResults, zeroResultRate]
            properties:
              query: { type: string }
              searches: { type: integer }
              zeroResults: { type: integer }
              zeroResultRate: { type: number }
        hiddenBelowFloor:
          type: object
          description: >
            Rare terms, counted but not named. Present so the totals stay
            honest about how much of search is failing.
          required: [terms, searches, zeroResults]
          properties:
            terms: { type: integer }
            searches: { type: integer }
            zeroResults: { type: integer }

    FeedbackOutcome:
      type: object
      description: >
        Present only when `feedbackText` was sent. Says what the deterministic
        pipeline was actually asked to do, so a user can tell "understood and
        applied" from "not understood".
      required: [understood, applied, ignoredReasons]
      properties:
        understood:
          type: boolean
          description: False means nothing in the text survived validation.
        applied:
          type: object
          properties:
            excludePlaceIds:
              type: array
              items: { type: string, format: uuid }
            avoidCategoryKeys:
              type: array
              items: { type: string }
            requireDietaryKeys:
              type: array
              items: { type: string }
            budgetMaxAmount:
              type: integer
              description: Integer minor units, always below the room's own budget.
            radiusM: { type: integer }
            maxStops: { type: integer }
        ignoredReasons:
          type: array
          description: >
            Why parts were dropped. `PLACE_NOT_A_CANDIDATE` is the shape of a
            hallucinated place id; `BUDGET_NOT_TIGHTENED` means the proposal
            tried to loosen a constraint rather than narrow it.
          items:
            type: string
            enum:
              [
                SCHEMA_INVALID,
                PLACE_NOT_A_CANDIDATE,
                CATEGORY_UNKNOWN,
                DIETARY_UNKNOWN,
                BUDGET_NOT_TIGHTENED,
                RADIUS_NOT_REDUCED,
                STOPS_NOT_REDUCED,
                NOTHING_UNDERSTOOD,
              ]

    CmsExperiment:
      type: object
      required: [key, enabled, variants]
      properties:
        key: { type: string }
        description: { type: [string, 'null'] }
        enabled: { type: boolean }
        variants:
          type: object
          additionalProperties: { type: number }
        controlShare:
          type: number
          description: What is left after the named variants.
        updatedAt: { type: string, format: date-time }

    CmsRankingEvaluation:
      type: object
      required: [configVersion, baselineVersion, runsEvaluated, metrics, skipped]
      properties:
        configVersion: { type: integer }
        baselineVersion:
          type: string
          description: The active config it was compared against, or "default".
        runsEvaluated: { type: integer }
        metrics:
          type: object
          required: [top1Agreement, top5Overlap, newZeroResults, meanCandidateCount]
          properties:
            top1Agreement:
              type: number
              description: Share of runs whose top result is unchanged.
            top5Overlap:
              type: number
              description: Mean overlap of the top 5 — how far the ordering moved.
            newZeroResults:
              type: integer
              description: Runs where the candidate returns nothing and the baseline did not.
            meanCandidateCount: { type: number }
        skipped:
          type: array
          description: Runs that could not be evaluated, and why. Not counted as agreement.
          items:
            type: object
            required: [runId, reason]
            properties:
              runId: { type: string, format: uuid }
              reason: { type: string }

  headers:
    ETag:
      description: Deterministic entity tag over datasetVersion + the resolved request.
      schema: { type: string }
    CacheControl:
      description: Always `public, max-age=0, must-revalidate` — immutable per version, but the active version can change.
      schema: { type: string }

  responses:
    NotModified:
      description: >
        The client's ETag still matches. No body, by definition — this is the
        whole saving the tag exists for.
    AdministrativeUnavailable:
      description: >
        No administrative dataset is PUBLISHED. Deliberately not an empty list,
        which would read as "Vietnam has no provinces"; this is an operational
        fault and #463 alerts on it.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    BadRequest:
      description: Validation or business rule failure
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    Unauthorized:
      description: Missing or invalid credentials
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    Forbidden:
      description: Actor lacks permission on this resource
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    Conflict:
      description: Version/state conflict
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    RateLimited:
      description: Rate limit exceeded
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }

security:
  - bearerAuth: []
