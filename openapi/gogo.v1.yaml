  /plans/{id}/regenerate:
    post:
      operationId: regeneratePlan
      tags: [plans]
      summary: 'Host-only: regenerate — locked stops are invariant (SG-008)'
      description: >
        `feedbackText` (SG-009) is the member's own words. It is turned into
        structured constraints, validated against the verified candidate set
        and the room's own constraints, and only then handed to the same
        deterministic pipeline — which stays the thing making the decision.


        Feedback may only **tighten**: it can narrow the budget, shrink the
        radius, drop stops or avoid a category. It cannot raise the budget the
        room agreed on, widen the host's radius, add stops, or reference a
        place that was not already a verified candidate. Anything it proposes
        outside those bounds is dropped with a reason code.


        The response reports what was understood and what was ignored, because
        feedback that silently changes nothing is indistinguishable from
        feedback that was never read.


        When AI parsing is disabled, times out, runs out of quota, or returns
        output that fails validation, a deterministic parser produces the
        result instead. There is no failure path that surfaces a model error
        to the user.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                excludePlaceIds:
                  type: array
                  items: { type: string, format: uuid }
                feedbackText:
                  type: string
                  maxLength: 500
                  description: Free text, e.g. "rẻ hơn và gần hơn".
      responses:
        '201':
          description: New plan version — every locked stop is preserved verbatim
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Plan'
                  - type: object
                    properties:
                      feedback: { $ref: '#/components/schemas/FeedbackOutcome' }
        '409': { $ref: '#/components/responses/Conflict' }

