openapi: 3.1.0
info:
  title: GoGo API
  version: 1.0.0-alpha.18
  description: |
    Public contract for GoGo clients (Mobile, Web, Mini App). This page is the
    integration guide — every rule below is enforced by the API, not advisory.

    ## Base URL & versioning

    All paths are relative to `/v1`. Breaking changes to `/v1` are blocked in
    CI (oasdiff gate); additive changes ship freely. The deployed spec is
    always downloadable at `GET /v1/openapi.yaml` — generate your client from
    that file, never hand-write DTOs.

    ## Authentication (mobile)

    Mobile uses **bearer tokens**, not cookies (cookies + CSRF are the Web
    path; ignore them). Store tokens in Keychain/Keystore, never in
    AsyncStorage.

    1. `POST /auth/register` or `POST /auth/login` → `{ accessToken,
       refreshToken, expiresIn }`.
    2. Send `Authorization: Bearer <accessToken>` on every call. Access tokens
       live ≤15 minutes.
    3. On `401`, call `POST /auth/refresh` with `{ refreshToken }` → a **new
       pair**. Refresh tokens are single-use: store the new one immediately and
       discard the old.
    4. **Reusing an old refresh token revokes the entire session family** (theft
       detection) — the user is logged out everywhere. Serialise refresh calls
       behind one mutex; parallel refreshes will log the user out.
    5. `DELETE /sessions/current` with `{ "allDevices": true|false }` to log out.

    ### Guest sessions (no account)

    `POST /sessions/guest` (room code) or `POST /rooms/join/guest` (invite code)
    returns `accessToken` **scoped to that one room** plus a long-lived
    `guestToken`. Persist `guestToken` to re-enter the room later
    (`POST /auth/refresh` with `{ guestToken }` returns a fresh access token).
    On registration, pass the stored token as `claimGuestToken` to migrate the
    guest's memberships, preferences and votes to the new account.

    Guests can only touch their own room — any other room returns
    `403 ROOM_SCOPE_VIOLATION`. Guests cannot create rooms or use `/me/saved`,
    `/reviews` (`403 USER_ONLY`).

    ## Errors

    Every failure uses one envelope:

    ```json
    { "code": "ROOM_NOT_MATCHING", "message": "...", "field_errors": [],
      "request_id": "9f0c…", "retryable": false }
    ```

    Branch on `code` (stable), never on `message` (may change / is not
    localised). `field_errors[]` maps validation failures to form fields.
    Include `request_id` in bug reports. `retryable: true` means a backoff
    retry is sensible (429, 5xx).

    ## Idempotency

    Any retryable mutation accepts `Idempotency-Key: <8–128 chars>`. Replaying
    the same key returns the original response with `x-idempotent-replay: true`
    instead of acting twice. Same key + a different body → `422
    IDEMPOTENCY_KEY_REUSED`. Use it on room creation, votes, plan edits and
    check-ins — anything you might retry after a flaky network.

    ## Rate limits

    `429 RATE_LIMITED` (`retryable: true`) with per-action budgets: login 5/min,
    guest session 10/min, room join 10/min, suggestions 6/min, votes 60/min,
    search 60/min, place resolve 10/min, submissions 5/min. Back off, do not
    hammer.

    ## Data conventions

    - **Money is integer minor units** (VND has no decimals → `250000` means
      250.000 ₫). Never send floats.
    - `budgetMode` is `total` or `per_person`; convert consistently — the API
      never mixes them.
    - Times are ISO-8601 UTC. Opening hours use minutes-of-day in **place-local
      time** (`closesAtMinute: 1380` = 23:00).
    - **DTOs return facts, not sentences.** Compose copy client-side from
      `type` + `participantCount` + `budgetMode` — the API deliberately never
      sends "Cả hai bạn…" strings, so i18n stays on the client.
    - Lists are cursor-paginated: pass back `nextCursor` verbatim; `null` means
      the end.

    ## Permissions

    `host` / `member` / `guest` are enforced server-side on every call. Hiding a
    button is UX, not security — expect `403 HOST_ONLY` if a non-host calls a
    host action. Room state also gates actions (`409 ROOM_NOT_MATCHING`,
    `ROOM_ACTIVE`, …), so drive the UI from `room.status`.

    ## Typical mobile flow

    `POST /rooms` → `PATCH /rooms/{id}/status` (`collecting`) →
    `POST /rooms/{id}/invites` (share code) → guests join →
    `PUT /rooms/{id}/preferences/me` + `POST …/preferences/complete` →
    room flips to `matching` automatically → `POST /rooms/{id}/suggestions` →
    `PUT /rooms/{id}/votes/{placeId}` → `POST /rooms/{id}/votes/finalize` →
    plan appears (`GET /rooms/{id}/plans/current`) → lock/regenerate →
    `PATCH /rooms/{id}/status` (`active`) → complete stops + check-ins.
servers:
  - url: /v1
    description: Same-origin (app talks to the deployed API host)
tags:
  - name: system
    description: Health probes and the contract itself.
  - name: sessions
    description: Register, login, refresh rotation, guest sessions.
  - name: rooms
    description: Room lifecycle, constraints, invites, members, seed places.
  - name: links
    description: Canonical share links `https://<share-host>/l/{slug}` — mint, edge resolve, revoke.
  - name: preferences
    description: Private per-member preferences and the taxonomy that drives them.
  - name: places
    description: Search, place detail, area autocomplete, add-by-link ingestion.
  - name: suggestions
    description: Deterministic suggestion runs, voting, decisions.
  - name: plans
    description: Itinerary versions, lock/regenerate, active date, check-ins.
  - name: me
    description: Profile, saved items, reviews, notifications, privacy.
  - name: cms
    description: Staff-only endpoints — not used by the mobile app.

paths:
  /metrics:
    get:
      operationId: scrapeMetrics
      tags: [system]
      summary: Prometheus text exposition for a scraper
      description: >
        Guarded by `METRICS_TOKEN` as a bearer token. Series names and label
        values describe internal structure — which providers are called, which
        admin actions happen — so this is not public.


        With no token configured the route answers **404**, not 401: an
        unconfigured endpoint should not advertise that it exists and is
        merely locked.
      responses:
        '200':
          description: Metrics in Prometheus text format
          content:
            text/plain:
              schema: { type: string }
        '401':
          description: Missing or wrong token
        '404':
          description: No metrics token is configured in this environment

  /health:
    get:
      operationId: getHealth
      tags: [system]
      summary: Liveness probe
      security: []
      responses:
        '200':
          description: Service is alive
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
                    enum: [ok]

  /health/ready:
    get:
      operationId: getReadiness
      tags: [system]
      summary: Readiness probe — checks database and Redis
      description: >
        Returns 503 when the database is unreachable. Redis failure degrades
        (rate limits fail open) and is reported without failing readiness.
        Uptime monitors should point here, not at /health.
      security: []
      responses:
        '200':
          description: Dependencies reachable
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, enum: [ready] }
                  checks:
                    type: object
                    properties:
                      db: { type: string, enum: [ok, failed] }
                      redis: { type: string, enum: [ok, failed, skipped] }
        '503':
          description: Database unreachable
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }

  /openapi.yaml:
    get:
      operationId: getOpenapiSpec
      tags: [system]
      summary: The deployed contract — generate clients from this
      security: []
      responses:
        '200':
          description: OpenAPI document (YAML)
          content:
            application/yaml:
              schema: { type: string }

  /auth/register:
    post:
      operationId: register
      tags: [sessions]
      summary: Register a user account (optionally claiming a guest session)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password, displayName]
              properties:
                email: { type: string, format: email, maxLength: 254 }
                password: { type: string, minLength: 10, maxLength: 128 }
                displayName: { type: string, minLength: 1, maxLength: 50 }
                claimGuestToken:
                  type: string
                  description: Opaque guest token to re-parent guest history (FR-AUTH-003).
      responses:
        '201':
          description: Registered; web clients also receive HttpOnly session cookies.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TokenGrant' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409':
          description: Registration could not be completed (never confirms account existence)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /auth/login:
    post:
      operationId: login
      tags: [sessions]
      summary: Login with email + password (enumeration-safe, lockout on abuse)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string }
      responses:
        '201':
          description: Authenticated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TokenGrant' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /auth/refresh:
    post:
      operationId: refreshSession
      tags: [sessions]
      summary: Rotate a refresh token or renew a guest access token
      description: >
        Refresh tokens are single-use; presenting a superseded token revokes
        the whole session family. Web clients may rely on the HttpOnly refresh
        cookie instead of the body field.
      security: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                refreshToken: { type: string }
                guestToken: { type: string }
      responses:
        '201':
          description: New token grant
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TokenGrant' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /sessions/guest:
    post:
      operationId: createGuestSession
      tags: [sessions]
      summary: Join a room as a guest with a display name only (FR-AUTH-002)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [roomCode, displayName]
              properties:
                roomCode: { type: string, minLength: 6, maxLength: 64 }
                displayName: { type: string, minLength: 1, maxLength: 50 }
      responses:
        '201':
          description: Guest session created; access token is scoped to this room only.
          content:
            application/json:
              schema:
                type: object
                required: [guestSessionId, roomId, accessToken, guestToken]
                properties:
                  guestSessionId: { type: string, format: uuid }
                  roomId: { type: string, format: uuid }
                  accessToken: { type: string }
                  guestToken:
                    type: string
                    description: Long-lived opaque credential for re-entry and claim.
        '404': { $ref: '#/components/responses/NotFound' }
        '410':
          description: Room expired or no longer joinable
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /sessions/current:
    delete:
      operationId: endCurrentSession
      tags: [sessions]
      summary: Logout — revoke the current session (or all devices)
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                allDevices: { type: boolean, default: false }
      responses:
        '200':
          description: Session revoked; cookies cleared.
          content:
            application/json:
              schema:
                type: object
                properties:
                  revoked: { type: boolean }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /me:
    patch:
      operationId: updateProfile
      tags: [me]
      summary: Update display name / locale
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                displayName: { type: string, minLength: 1, maxLength: 50 }
                locale: { type: string, enum: [vi, en] }
      responses:
        '200': { description: Updated profile facts }
    delete:
      operationId: deleteAccount
      tags: [me]
      summary: Delete account — PII nulled, sessions revoked, content pseudonymized
      responses:
        '200': { description: '{ deleted: true }' }
    get:
      operationId: getMe
      tags: [me]
      summary: Current actor profile facts
      responses:
        '200':
          description: Actor profile (shape depends on actorType)
          content:
            application/json:
              schema:
                type: object
                required: [actorType, id]
                properties:
                  actorType: { type: string, enum: [user, guest] }
                  id: { type: string, format: uuid }
                  displayName: { type: string }
                  email: { type: string }
                  locale: { type: string }
                  roomId: { type: string, format: uuid }
                  expiresAt: { type: string, format: date-time }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /rooms:
    get:
      operationId: listRooms
      tags: [rooms]
      summary: Rooms the caller belongs to, most recently active first
      description: >
        A room used to be reachable only by id, so a client that lost the id
        lost the room — closing the app mid-flow was enough. Keyset paging on
        `(updatedAt, id)` because a room's timestamp moves while the list is
        being read: one vote is enough. Each row carries the progress needed to
        draw it, so a "your rooms" screen makes one call, not one per room. The
        invite code is deliberately absent — a list screen has no reason to hand
        one out.
      parameters:
        - name: status
          in: query
          description: Repeatable or comma-separated; unknown values are ignored.
          schema:
            type: string
            example: collecting,matching
        - {
            name: limit,
            in: query,
            schema: { type: integer, minimum: 1, maximum: 50, default: 20 },
          }
        - { name: cursor, in: query, schema: { type: string, maxLength: 512 } }
      responses:
        '200':
          description: One page of room summaries
          content:
            application/json:
              schema:
                type: object
                required: [items, nextCursor]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/RoomListItem' }
                  nextCursor: { type: string, nullable: true }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      operationId: createRoom
      tags: [rooms]
      summary: Create a couple/group room with constraint v1 and optional seed places
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [type, decisionMode, participantCount, constraint]
              properties:
                type: { type: string, enum: [couple, group] }
                decisionMode:
                  type: string
                  enum: [match, vote, host]
                  description: couple allows match|host; group allows vote|host.
                participantCount: { type: integer, minimum: 2, maximum: 20 }
                title: { type: string, maxLength: 80 }
                scheduledDate: { type: string, format: date-time }
                constraint: { $ref: '#/components/schemas/RoomConstraintInput' }
                seedPlaceIds:
                  type: array
                  maxItems: 10
                  items: { type: string, format: uuid }
      responses:
        '201':
          description: Room created (creator becomes host)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RoomSummary' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /rooms/{id}:
    get:
      operationId: getRoom
      tags: [rooms]
      summary: Room summary facts (members only; share code is host-only)
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Room summary
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RoomSummary' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /rooms/{id}/constraints:
    patch:
      operationId: updateRoomConstraints
      tags: [rooms]
      summary: 'Host-only: new constraint version; marks scores/plans stale'
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/RoomConstraintInput'
                - type: object
                  required: [expectedConstraintVersion]
                  properties:
                    expectedConstraintVersion: { type: integer, minimum: 1 }
                    participantCount: { type: integer, minimum: 2, maximum: 20 }
      responses:
        '200':
          description: Updated summary with bumped constraintVersion
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RoomSummary' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }

  /rooms/{id}/status:
    patch:
      operationId: transitionRoom
      tags: [rooms]
      summary: 'Host-only: validated room state transition (SRS §7.2)'
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status:
                  type: string
                  enum: [draft, collecting, matching, ready, active, completed, cancelled, expired]
      responses:
        '200':
          description: Transitioned
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RoomSummary' }
        '409': { $ref: '#/components/responses/Conflict' }

  /rooms/{id}/events:
    get:
      operationId: streamRoomEvents
      tags: [rooms]
      summary: 'Realtime room stream (SSE)'
      description: >
        Server-sent events for one room, authorized exactly like `GET
        /rooms/{id}`: members only, and a guest token reaches only the room it
        is bound to.


        SSE rather than a WebSocket because every event here is server →
        client; nothing needs a bidirectional channel, and this keeps the same
        bearer auth as the rest of the API.


        Event types: `room.status_changed`, `participant.joined`,
        `participant.left`, `participant.selection_changed`,
        `matching.started`, `matching.completed`, `matching.failed`,
        `suggestions.generated`, `suggestions.updated`, `vote.changed`,
        `plan.updated`, plus two stream-level types — `heartbeat`, which keeps
        idle connections alive through proxies, and `resync`, which says the
        client's resume point is older than the replay buffer and it must
        refetch. `resync` exists so a gap is reported rather than silently
        skipped: a client that is wrong without knowing it is the failure this
        endpoint is meant to prevent.


        Each message's `id` is a per-room sequence number. Send it back as
        `Last-Event-ID` (or the `lastEventId` query parameter, which browsers
        need because `EventSource` cannot set headers) to resume.


        Payloads carry facts, never composed copy, and never another member's
        preference selections — `participant.selection_changed` reports
        progress only (FR-PREF-005).


        Polling the underlying endpoints remains a supported fallback; when
        `REALTIME_SSE_ENABLED` is off, this route answers `503 REALTIME_DISABLED`
        and clients should poll.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - name: Last-Event-ID
          in: header
          required: false
          schema: { type: string }
          description: The last sequence number received, to resume after a reconnect.
        - name: lastEventId
          in: query
          required: false
          schema: { type: string }
          description: Same as the header, for browser EventSource which cannot set one.
      responses:
        '200':
          description: An event stream
          content:
            text/event-stream:
              schema: { $ref: '#/components/schemas/RoomEvent' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429':
          description: Too many open streams for this session
        '503':
          description: Realtime disabled in this environment; poll instead

  /rooms/{id}/members:
    get:
      operationId: listRoomMembers
      tags: [rooms]
      summary: Member progress facts (never other members' preference selections)
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Members
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/RoomMember' }

  /rooms/{id}/members/{memberId}:
    delete:
      operationId: removeRoomMember
      tags: [rooms]
      summary: 'Host-only: remove a member (revokes guest session if guest)'
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: memberId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: Removed }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /rooms/{id}/invites:
    post:
      operationId: createRoomInvite
      tags: [rooms]
      summary: 'Host-only: create a high-entropy expiring invite (code shown once)'
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                maxUses: { type: integer, minimum: 1, maximum: 100 }
      responses:
        '201':
          description: Invite created — plaintext code returned exactly once, only hash stored.
          content:
            application/json:
              schema:
                type: object
                required: [inviteId, code, expiresAt]
                properties:
                  inviteId: { type: string, format: uuid }
                  code: { type: string }
                  expiresAt: { type: string, format: date-time }
                  maxUses: { type: integer }
    get:
      operationId: listRoomInvites
      tags: [rooms]
      summary: 'Host-only: invite metadata (never codes)'
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: Invites }

  /rooms/{id}/invites/{inviteId}:
    delete:
      operationId: revokeRoomInvite
      tags: [rooms]
      summary: 'Host-only: revoke an invite'
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: inviteId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: Revoked }

  /rooms/join:
    post:
      operationId: joinRoom
      tags: [rooms]
      summary: Authenticated user joins via invite code
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [inviteCode]
              properties:
                inviteCode: { type: string }
      responses:
        '201':
          description: Joined (idempotent — re-joining returns the existing membership)
          content:
            application/json:
              schema:
                type: object
                properties:
                  roomId: { type: string, format: uuid }
                  memberId: { type: string, format: uuid }
                  role: { type: string, enum: [host, member] }
        '410':
          description: Invite expired/revoked/spent or room not joinable
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }

  /rooms/join/guest:
    post:
      operationId: joinRoomAsGuest
      tags: [rooms]
      summary: Guest joins via invite code without an account (FR-AUTH-002)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [inviteCode, displayName]
              properties:
                inviteCode: { type: string }
                displayName: { type: string, minLength: 1, maxLength: 50 }
      responses:
        '201':
          description: Guest session bound to the invite's room
          content:
            application/json:
              schema:
                type: object
                properties:
                  guestSessionId: { type: string, format: uuid }
                  roomId: { type: string, format: uuid }
                  accessToken: { type: string }
                  guestToken: { type: string }
        '410':
          description: Invite expired/revoked/spent
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }

  /rooms/{id}/seed-places:
    post:
      operationId: addRoomSeedPlaces
      tags: [rooms]
      summary: 'Host-only: attach verified places to the room (FR-ROOM-010)'
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [placeIds]
              properties:
                placeIds:
                  type: array
                  minItems: 1
                  maxItems: 10
                  items: { type: string, format: uuid }
      responses:
        '200': { description: Updated seed list }
        '400': { $ref: '#/components/responses/BadRequest' }

  /rooms/{id}/seed-places/{placeId}:
    delete:
      operationId: removeRoomSeedPlace
      tags: [rooms]
      summary: 'Host-only: remove a seed place'
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: placeId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: Updated seed list }

  /rooms/{roomId}/preferences/me:
    get:
      operationId: getMyPreferences
      tags: [preferences]
      summary: Caller's own preference draft (private to the member)
      parameters:
        - { name: roomId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Own preferences with version
          content:
            application/json:
              schema:
                type: object
                properties:
                  selections:
                    type: object
                    additionalProperties:
                      type: array
                      items: { type: string }
                  weights:
                    type: object
                    additionalProperties: { type: number }
                  version:
                    type: integer
                    description: Pass back as `expectedVersion`; 0 means nothing saved yet.
                  isDraft: { type: boolean }
                  completedAt: { type: string, format: date-time }
    put:
      operationId: saveMyPreferences
      tags: [preferences]
      summary: Autosave with optimistic concurrency (expectedVersion)
      parameters:
        - { name: roomId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [selections, expectedVersion]
              properties:
                selections:
                  type: object
                  additionalProperties:
                    type: array
                    items: { type: string }
                  description: Taxonomy kind → selected stable keys.
                weights:
                  type: object
                  additionalProperties: { type: number }
                expectedVersion: { type: integer, minimum: 0 }
      responses:
        '200':
          description: Autosaved
          content:
            application/json:
              schema:
                type: object
                properties:
                  version: { type: integer }
                  isDraft: { type: boolean }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409': { $ref: '#/components/responses/Conflict' }

  /rooms/{roomId}/preferences/complete:
    post:
      operationId: completeMyPreferences
      tags: [preferences]
      summary: Mark own preferences complete; room auto-moves to matching when everyone is done
      parameters:
        - { name: roomId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Completed; room flips to `matching` when everyone is done
          content:
            application/json:
              schema:
                type: object
                properties:
                  completed: { type: boolean }
                  allMembersCompleted:
                    type: boolean
                    description: Every member has finished their preferences.
                  roomStatus:
                    type: string
                    enum:
                      [draft, collecting, matching, ready, active, completed, cancelled, expired]
                  roomReadyForMatching:
                    type: boolean
                    description: >
                      Everyone has finished **and** the room is in a state the
                      suggestions endpoint accepts. It used to report member
                      progress alone, so a client could be told the room was
                      ready and then get 409 ROOM_NOT_MATCHING.
        '400': { $ref: '#/components/responses/BadRequest' }

  /uploads:
    post:
      operationId: createUpload
      tags: [plans]
      summary: 'Presigned upload for moderated user media'
      description: >
        Check-in accepts `photoKeys` and `billPhotoKey` — keys of already
        uploaded objects — and until this endpoint existed nothing in the
        contract could produce one, so the mobile check-in sheet shipped
        without photos or the verified bill (FR-PLAN-009 was unreachable).


        Presigned rather than multipart: the client PUTs the bytes straight to
        storage with the returned URL and sends only the `key` back. Image
        bytes never cross the API.


        The returned key is bound to the actor that created it. Attaching a key
        belonging to another actor, an expired one, or one issued for a
        different purpose is rejected — the server does not distinguish those
        cases in its answer.


        Content type and size are enforced server-side and the content type is
        part of what is signed, so storage refuses an upload that does not
        match what was authorized.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [purpose, contentType, contentLength]
              properties:
                purpose:
                  type: string
                  enum: [checkin_photo, bill_photo, place_photo]
                contentType:
                  type: string
                  enum: [image/jpeg, image/png, image/webp, image/heic]
                contentLength:
                  type: integer
                  description: Declared up front, so an oversized file is refused before a URL exists.
      responses:
        '201':
          description: Upload authorized
          content:
            application/json:
              schema:
                type: object
                required: [key, uploadUrl, expiresAt, maxBytes]
                properties:
                  key:
                    type: string
                    description: Send this back in the check-in; it is only usable by this actor.
                  uploadUrl: { type: string }
                  expiresAt: { type: string, format: date-time }
                  maxBytes: { type: integer }
        '400': { $ref: '#/components/responses/BadRequest' }
        '503':
          description: Object storage is not configured in this environment

  /administrative/version:
    get:
      operationId: getAdministrativeVersion
      tags: [administrative]
      summary: Active administrative dataset version (the cheap poll)
      description: >
        ADM-003 / ADR-0019. A client holds a snapshot and refetches only when
        datasetVersion changes. Serves the one PUBLISHED dataset; 503 when none
        is published, which is an operational fault rather than an empty result.
      security: []
      parameters:
        - $ref: '#/components/parameters/IfNoneMatch'
      responses:
        '200':
          description: Active dataset version and record counts
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
            Cache-Control: { $ref: '#/components/headers/CacheControl' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdministrativeVersion' }
        '304': { $ref: '#/components/responses/NotModified' }
        '503': { $ref: '#/components/responses/AdministrativeUnavailable' }

  /administrative/provinces:
    get:
      operationId: listAdministrativeProvinces
      tags: [administrative]
      summary: Current provinces and municipalities, ordered by code
      description: >
        ADM-003. The 34 current province-level units. Legacy district-level
        units are never returned here — they were dissolved on 2025-07-01.
      security: []
      parameters:
        - $ref: '#/components/parameters/AdministrativeLimit'
        - $ref: '#/components/parameters/AdministrativeCursor'
        - $ref: '#/components/parameters/IfNoneMatch'
      responses:
        '200':
          description: Province page
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
            Cache-Control: { $ref: '#/components/headers/CacheControl' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdministrativeUnitPage' }
        '304': { $ref: '#/components/responses/NotModified' }
        '503': { $ref: '#/components/responses/AdministrativeUnavailable' }

  /administrative/provinces/{provinceCode}/communes:
    get:
      operationId: listAdministrativeCommunes
      tags: [administrative]
      summary: Current communes of one province, ordered by code
      description: >
        ADM-003. A province code that names no current province answers 404
        PROVINCE_NOT_FOUND rather than an empty page — "no communes" and "no
        such province" are different answers.
      security: []
      parameters:
        - name: provinceCode
          in: path
          required: true
          schema: { type: string, pattern: '^[0-9]{2,5}$' }
        - $ref: '#/components/parameters/AdministrativeLimit'
        - $ref: '#/components/parameters/AdministrativeCursor'
        - $ref: '#/components/parameters/IfNoneMatch'
      responses:
        '200':
          description: Commune page
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
            Cache-Control: { $ref: '#/components/headers/CacheControl' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdministrativeUnitPage' }
        '304': { $ref: '#/components/responses/NotModified' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/AdministrativeUnavailable' }

  /administrative/search:
    get:
      operationId: searchAdministrativeUnits
      tags: [administrative]
      summary: Accent-insensitive search over unit names
      description: >
        ADM-003. Matches both the short name ("Ba Đình") and the full name
        ("Phường Ba Đình"), accented or not, through the same Vietnamese
        normalizer the place search uses. Legacy units require includeLegacy.
      security: []
      parameters:
        - {
            name: query,
            in: query,
            required: true,
            schema: { type: string, minLength: 1, maxLength: 120 },
          }
        - { name: provinceCode, in: query, schema: { type: string, pattern: '^[0-9]{2,5}$' } }
        - $ref: '#/components/parameters/AdministrativeIncludeLegacy'
        - $ref: '#/components/parameters/AdministrativeLimit'
        - $ref: '#/components/parameters/AdministrativeCursor'
        - $ref: '#/components/parameters/IfNoneMatch'
      responses:
        '200':
          description: Matching units, current first, then legacy when asked for
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
            Cache-Control: { $ref: '#/components/headers/CacheControl' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdministrativeUnitPage' }
        '304': { $ref: '#/components/responses/NotModified' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/AdministrativeUnavailable' }

  /administrative/resolve:
    get:
      operationId: resolveAdministrativeCode
      tags: [administrative]
      summary: What a code meant on a date, and where the unit went
      description: >
        ADM-003 / ADR-0019 §2. Codes are reused: 2,212 of the 3,321 current
        commune codes named a different unit before 2025-07-01, so `at` selects
        the effective period. Successors come from canonical changes only — a
        divided commune is quarantined, never resolved, and is reported with
        unresolved=true rather than the source's guess.
      security: []
      parameters:
        - {
            name: code,
            in: query,
            required: true,
            schema: { type: string, pattern: '^[0-9]{2,5}$' },
          }
        - name: at
          in: query
          description: ISO date. Absent means "the current unit".
          schema: { type: string, format: date }
        - $ref: '#/components/parameters/IfNoneMatch'
      responses:
        '200':
          description: The unit effective on that date, plus canonical successors
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
            Cache-Control: { $ref: '#/components/headers/CacheControl' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdministrativeResolution' }
        '304': { $ref: '#/components/responses/NotModified' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/AdministrativeUnavailable' }

  /administrative/units/{code}:
    get:
      operationId: getAdministrativeUnit
      tags: [administrative]
      summary: One code and its effective periods
      description: >
        ADM-003. Without includeLegacy only the current period is returned, and
        a code naming no current unit answers 404 UNIT_NOT_CURRENT.
      security: []
      parameters:
        - name: code
          in: path
          required: true
          schema: { type: string, pattern: '^[0-9]{2,5}$' }
        - $ref: '#/components/parameters/AdministrativeIncludeLegacy'
        - $ref: '#/components/parameters/IfNoneMatch'
      responses:
        '200':
          description: The current unit and the periods this code has had
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
            Cache-Control: { $ref: '#/components/headers/CacheControl' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdministrativeUnitDetail' }
        '304': { $ref: '#/components/responses/NotModified' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/AdministrativeUnavailable' }

  /cms/administrative-datasets:
    get:
      operationId: listAdministrativeDatasets
      tags: [cms, administrative]
      summary: 'Ops: every imported dataset version, newest first (ADM-005)'
      description: >
        ADM-005 (#458). Read needs rank >= ops_admin; every write on this
        resource needs the exact ops_admin role (or the audited super-admin
        bypass), so an on-call operator can inspect a dataset without being able
        to publish it. `validation` is the stored result summary — absent means
        the version has never been validated, which is itself a refusal reason
        for publication.
      parameters:
        - {
            name: limit,
            in: query,
            schema: { type: integer, minimum: 1, maximum: 100, default: 25 },
          }
        - { name: offset, in: query, schema: { type: integer, minimum: 0, default: 0 } }
      responses:
        '200':
          description: A page of dataset versions
          content:
            application/json:
              schema:
                type: object
                required: [items, total, limit, offset]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/AdministrativeDatasetSummary' }
                  total: { type: integer }
                  limit: { type: integer }
                  offset: { type: integer }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /cms/administrative-datasets/capability:
    get:
      operationId: getAdministrativeCapability
      tags: [cms, administrative]
      summary: 'Ops: what this environment can currently do (ADM-010)'
      description: >
        Deliberately separate from readiness. An environment with no
        administrative dataset still serves rooms, search and plans; it simply
        cannot publish a place, which the domain guard already refuses. Taking
        the whole API out of the load balancer for that would turn a
        configuration gap into an outage.


        This is also where the exact dataset and boundary versions live. They
        are not Prometheus labels: a label whose values grow with every
        publication is a series set that never stops growing, so the numbers go
        on a dashboard and the identities go here.


        `resolver` is `FULL` with polygons loaded, `PARTIAL` without them — the
        resolver still answers from explicit codes, stored names and the change
        mapping, which is less of the catalogue rather than none of it.
      responses:
        '200':
          description: Current administrative capability
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdministrativeCapability' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /cms/administrative-datasets/import:
    post:
      operationId: importAdministrativeDataset
      tags: [cms, administrative]
      summary: 'Ops: import the pinned snapshot set into staging (ADM-005)'
      description: >
        Writes a STAGED version and nothing else — no path here can touch the
        active dataset. One transaction: a failure leaves nothing behind, so a
        retry is a clean import rather than a half-written version that the
        checksum guard would then call a duplicate. Re-importing byte-identical
        sources at the same override revision is 409 DATASET_ALREADY_IMPORTED,
        because the same inputs are the same dataset.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                overrideRevision:
                  type: integer
                  minimum: 0
                  maximum: 10000
                  default: 0
                  description: >
                    Bumped by a reviewer decision rather than an upstream
                    release. It is a component of the combined version, so
                    bumping it mints a new dataset from unchanged sources.
      responses:
        '201':
          description: A new STAGED dataset version
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdministrativeImportReport' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /cms/administrative-datasets/restorable:
    get:
      operationId: listRestorableAdministrativeDatasets
      tags: [cms, administrative]
      summary: 'Ops: versions a rollback could restore (ADM-005)'
      description: >
        Previously published, not active now. A version that was never published
        never appears here: rollback restores an earlier active dataset, it does
        not publish a new one.
      responses:
        '200':
          description: Restorable versions, most recently published first
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/AdministrativeDatasetSummary' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /cms/administrative-datasets/{id}:
    get:
      operationId: getAdministrativeDataset
      tags: [cms, administrative]
      summary: 'Ops: one dataset version with its stored validation and diff'
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: The dataset version
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/AdministrativeDatasetSummary'
                  - type: object
                    properties:
                      validationReport:
                        $ref: '#/components/schemas/AdministrativeValidationReport'
                      diffSummary:
                        type: object
                        nullable: true
                        additionalProperties: true
                        description: >
                          The diff stored when this version was last validated.
                          It describes the baseline that was active *then* —
                          GET /diff recomputes against today's.
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /cms/administrative-datasets/{id}/diff:
    get:
      operationId: getAdministrativeDatasetDiff
      tags: [cms, administrative]
      summary: 'Ops: this version against whatever is published now (ADM-005)'
      description: >
        Recomputed on read, never written. A first publication compares against
        an explicitly empty baseline, so `fromVersion` is null rather than the
        request being an error. Entries are paged; `countsByCategory` is always
        complete, so a reviewer walking a 14,000-entry diff never sees a total
        that shrinks to the page. A change to nothing but `overrideRevision`
        yields exactly one SOURCE_DRIFT entry rather than replaying every
        migration the dataset already asserted.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - {
            name: limit,
            in: query,
            schema: { type: integer, minimum: 1, maximum: 500, default: 100 },
          }
        - { name: offset, in: query, schema: { type: integer, minimum: 0, default: 0 } }
      responses:
        '200':
          description: The diff, with complete counts and a bounded entry page
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdministrativeDatasetDiff' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /cms/administrative-datasets/{id}/validate:
    post:
      operationId: validateAdministrativeDataset
      tags: [cms, administrative]
      summary: 'Ops: run every gate against this exact snapshot (ADM-005)'
      description: >
        Runs the ADM-004 gates and stores the result bound to the dataset's
        identity, checksum, staged-row digest, override revision and validator
        version. Re-validating replaces the previous result rather than adding
        to it. A publishable result moves the version to VALIDATED; a failing one
        leaves it STAGED, because it failed a check — nobody rejected it.


        Because it writes that status, validation is a transition and is
        serialised behind publish and rollback on the same advisory lock. Only a
        STAGED or VALIDATED version may be validated: applied to the active
        dataset the status write would demote it out of PUBLISHED and leave the
        environment with no active version, and applied to a ROLLED_BACK one it
        would take it out of the restorable set. Both are refused with
        DATASET_STATE_NOT_VALIDATABLE and nothing is written.


        The row is re-read under the lock before the write. If the version, its
        checksum, its override revision or its staged rows moved while the gates
        were running, the report describes rows that are no longer there, so it
        is discarded with DATASET_CHANGED_DURING_VALIDATION rather than stored.
      responses:
        '201':
          description: The validation result and the diff computed with it
          content:
            application/json:
              schema:
                type: object
                required: [validation, diff]
                properties:
                  validation: { $ref: '#/components/schemas/AdministrativeValidationReport' }
                  diff: { $ref: '#/components/schemas/AdministrativeDatasetDiff' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: >
            Refused, and audited with its reason as
            `administrative_dataset.validate_rejected`. Nothing is written:
            not the lifecycle status, not the previous validation, not the
            active-version pointer, not the restorable set, not a place, not the
            cache. DATASET_STATE_NOT_VALIDATABLE when the version is not STAGED
            or VALIDATED, or DATASET_CHANGED_DURING_VALIDATION when it moved
            while the gates were running.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '429': { $ref: '#/components/responses/RateLimited' }
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - $ref: '#/components/parameters/IdempotencyKey'

  /cms/administrative-datasets/{id}/publish:
    post:
      operationId: publishAdministrativeDataset
      tags: [cms, administrative]
      summary: 'Ops: make this version the active dataset (ADM-005)'
      description: >
        Takes a dataset id and nothing else. No `publishable` flag, no checksum
        and no warning acknowledgement is accepted from the caller: inside the
        publishing transaction the server re-reads the lifecycle status, the
        stored checksum, the checksum the pinned files produce now, the digest of
        the staged rows and the validation bound to them, and refuses on the
        first disagreement.


        `publishable === errors === 0`. An ERROR can never be overridden; a
        WARNING never blocks and stays visible and audited.


        Demote and promote are one transaction serialised by an advisory lock, so
        there are never two active versions and never zero. The previous version
        is retained — it is what a rollback restores. Publishing the already
        active version is 409 DATASET_ALREADY_PUBLISHED, not a silent no-op;
        replaying the same `Idempotency-Key` returns the original result. The
        in-process cache pointer is refreshed only after commit and a failure to
        refresh it is reported in `cacheWarmed`, never rolled back: PostgreSQL is
        authoritative and other processes converge within the 60-second TTL.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '201':
          description: The version is now active
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdministrativeTransitionResult' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: >
            Refused, and audited with its reason. DATASET_NOT_VALIDATED,
            DATASET_REJECTED, DATASET_ALREADY_PUBLISHED, VALIDATION_MISSING,
            VALIDATION_STALE, VALIDATION_HAS_ERRORS, SNAPSHOT_CHECKSUM_MISMATCH,
            or ACTIVE_VERSION_CHANGED when another publication won the race
            while this one was being prepared.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /cms/administrative-datasets/{id}/rollback:
    post:
      operationId: rollbackAdministrativeDataset
      tags: [cms, administrative]
      summary: 'Ops: re-activate a previously published version (ADM-005)'
      description: >
        A forward act with its own audit row, not an undo. Nothing is deleted, no
        migration is reversed, no stored address text is rewritten and no place
        mapping is changed — stale mappings against the restored version are
        reported, not written, because whether a claim a person verified should
        be demoted is the mapping work's decision (#459/#461/#462).


        Refuses a version that was never published, one that is already active,
        and one whose stored rows no longer match the snapshot that was
        validated. It deliberately does not re-verify the pinned source files: a
        version published long ago may have been built from a snapshot no longer
        vendored, and refusing on that ground would remove the escape hatch
        exactly when it is needed.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '201':
          description: The earlier version is active again
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdministrativeTransitionResult' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: >
            Refused, and audited with its reason. DATASET_NEVER_PUBLISHED,
            DATASET_ALREADY_PUBLISHED, DATASET_NOT_RESTORABLE, VALIDATION_MISSING,
            DATASET_CORRUPTED, or ACTIVE_VERSION_CHANGED.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /cms/administrative-datasets/{id}/quarantine:
    get:
      operationId: listAdministrativeQuarantine
      tags: [cms, administrative]
      summary: 'Ops: the source-drift review queue for this dataset (ADM-011)'
      description: >
        The advisory change-mapping upstream is never authoritative. Rows whose
        source or target does not resolve — overwhelmingly divided communes,
        where the source offers a default successor ADR-0019 forbids trusting —
        are quarantined at import and wait here for a person.


        Counts come back in three groups because they answer three questions.
        `canonical` is every edge the dataset asserts, by change type.
        `backlog` is the quarantine rows themselves, by classification — this is
        the review queue. `decisions` is those rows by the state of their
        effective decision in the current draft set. They are deliberately not
        one map: `AdministrativeImportReport.classification` counts every
        advisory row including the ones the importer promoted, so a backlog read
        from it is nine times too large.


        Ordering is `(source code, id)`, so the candidates of one divided
        commune sit together and a page boundary cannot drift when a decision is
        appended mid-review.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - name: classification
          in: query
          schema: { type: string }
          description: Comma-separated quarantine classifications.
        - name: decisionState
          in: query
          schema: { type: string }
          description: >
            Comma-separated subset of UNDECIDED, ACCEPTED_DRAFT, REJECTED_DRAFT,
            SUPERSEDED.
        - {
            name: limit,
            in: query,
            schema: { type: integer, minimum: 1, maximum: 100, default: 50 },
          }
        - { name: cursor, in: query, schema: { type: string } }
      responses:
        '200':
          description: A page of the review queue, with complete counts
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdministrativeQuarantinePage' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /cms/administrative-datasets/{id}/quarantine/{rowId}:
    get:
      operationId: getAdministrativeQuarantineRow
      tags: [cms, administrative]
      summary: 'Ops: one quarantined advisory row and everything behind it'
      description: >
        The raw payload verbatim (bounded), the source and every candidate as
        full identities with their effective periods, whether each candidate's
        hierarchy resolves in this dataset, how many places carry the source
        code, the effective decision, and the whole append-only decision
        history.


        `proposedByUpstream` marks the successor the source guessed. It is
        reported so a reviewer can see what the source said and never
        pre-selected: accepting it by position would launder that guess through
        a person's click.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: rowId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: The quarantined row
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdministrativeQuarantineDetail' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /cms/administrative-datasets/{id}/override-set:
    get:
      operationId: getAdministrativeOverrideSet
      tags: [cms, administrative]
      summary: 'Ops: the draft decision set for this dataset (ADM-011)'
      description: >
        At most one DRAFT set exists per base dataset, held by a partial unique
        index. Its `revision` increments with every appended decision and is
        what a mutation sends back as `expectedRevision` — two reviewers
        deciding the same row a second apart both succeed without it, and the
        second silently wins.


        `draft` is null until the first decision opens one.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: The draft set, its counts, and earlier materialisations
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdministrativeOverrideSet' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /cms/administrative-datasets/{id}/quarantine/{rowId}/accept:
    post:
      operationId: acceptAdministrativeQuarantineRow
      tags: [cms, administrative]
      summary: 'Ops: accept the advisory edge onto a named target (ADM-011)'
      description: >
        Appends a decision to the draft set. It changes nothing that is running:
        the resolver reaches its quarantine branch only when no canonical edge
        exists for a source code, and a draft decision creates no edge, so a
        draft ACCEPT cannot outrank published data by construction.


        The target is named — code **and** effective date — because a code alone
        is not an identity: 2,212 of the 3,321 current commune codes changed
        meaning on 2025-07-01. There is deliberately no way to accept "the first
        candidate".


        Correcting an earlier decision appends a new one that supersedes it. The
        previous decision is never edited and never deleted.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: rowId, in: path, required: true, schema: { type: string, format: uuid } }
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [targetCode, targetEffectiveFrom, reason, expectedRevision]
              properties:
                targetCode: { type: string, minLength: 1, maxLength: 20 }
                targetEffectiveFrom: { type: string, format: date }
                reason:
                  type: string
                  minLength: 1
                  maxLength: 1000
                  description: Required. A decision nobody explained cannot be reviewed later.
                expectedRevision:
                  type: integer
                  minimum: 0
                  description: The draft set revision the reviewer was looking at.
      responses:
        '201':
          description: The appended decision
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdministrativeOverrideDecisionResult' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: >
            Refused, and audited. OVERRIDE_SET_NOT_DRAFT,
            OVERRIDE_SET_REVISION_CONFLICT when somebody else decided a row
            first, QUARANTINE_ROW_NOT_IN_DATASET, QUARANTINE_ROW_HAS_NO_SOURCE,
            OVERRIDE_TARGET_NOT_FOUND when the named identity is not in this
            dataset, OVERRIDE_TARGET_NOT_CURRENT, OVERRIDE_TARGET_HIERARCHY_INVALID,
            OVERRIDE_TARGET_IS_SOURCE, or OVERRIDE_EDGE_ALREADY_CANONICAL.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /cms/administrative-datasets/{id}/quarantine/{rowId}/reject:
    post:
      operationId: rejectAdministrativeQuarantineRow
      tags: [cms, administrative]
      summary: 'Ops: refuse the advisory edge (ADM-011)'
      description: >
        The advisory relation should not become a canonical change. It deletes
        no evidence — the row keeps its raw payload and travels into the derived
        dataset with the decision recorded beside it — and it rejects no place:
        this is the mapping source, not the catalogue.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: rowId, in: path, required: true, schema: { type: string, format: uuid } }
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [reason, expectedRevision]
              properties:
                reason: { type: string, minLength: 1, maxLength: 1000 }
                expectedRevision: { type: integer, minimum: 0 }
      responses:
        '201':
          description: The appended decision
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdministrativeOverrideDecisionResult' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: >
            Refused, and audited. OVERRIDE_SET_NOT_DRAFT,
            OVERRIDE_SET_REVISION_CONFLICT or QUARANTINE_ROW_NOT_IN_DATASET.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /cms/administrative-datasets/{id}/override-set/materialize:
    post:
      operationId: materializeAdministrativeOverrideSet
      tags: [cms, administrative]
      summary: 'Ops: turn the decisions into one new STAGED dataset (ADM-011)'
      description: >
        The only act in this feature that produces something the resolver will
        eventually answer from — and it still answers from nothing until the
        derived version is published.


        One transaction, serialised behind publish, rollback and validate on the
        same advisory lock. The base dataset is **copied, never moved**: its
        units, canonical changes and quarantine rows are byte-identical
        afterwards. The copies carry each row's effective decision, and accepted
        decisions additionally become canonical edges bound to the decision that
        made them.


        The derived version is STAGED and nothing more. It is not validated and
        not published as a side effect: it goes through the ordinary
        validate → diff → publish path, because a reviewer decision that
        published itself would be a publication nobody reviewed. Its
        `overrideRevision` is the base's plus one, which mints a new combined
        version and checksum deterministically.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [reason, expectedRevision]
              properties:
                reason: { type: string, minLength: 1, maxLength: 1000 }
                expectedRevision: { type: integer, minimum: 0 }
      responses:
        '201':
          description: The derived STAGED dataset version
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdministrativeMaterializeResult' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: >
            Refused, and audited. OVERRIDE_SET_NOT_FOUND,
            OVERRIDE_SET_NOT_DRAFT, OVERRIDE_SET_REVISION_CONFLICT,
            OVERRIDE_SET_EMPTY, BASE_DATASET_CHANGED, or
            SNAPSHOT_CHECKSUM_MISMATCH when a pinned file no longer matches the
            manifest and the derived version cannot be named.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /cms/administrative-datasets/{id}/override-set/abandon:
    post:
      operationId: abandonAdministrativeOverrideSet
      tags: [cms, administrative]
      summary: 'Ops: close a draft nobody is going to materialise (ADM-011)'
      description: >
        The set stops accepting decisions and can never be materialised. The
        decisions themselves stay exactly where they are — abandoning a round of
        review is not a reason to lose the record of what was considered.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [reason, expectedRevision]
              properties:
                reason: { type: string, minLength: 1, maxLength: 1000 }
                expectedRevision: { type: integer, minimum: 0 }
      responses:
        '201':
          description: The set is abandoned
          content:
            application/json:
              schema:
                type: object
                required: [overrideSetId, status, abandonedAt]
                properties:
                  overrideSetId: { type: string, format: uuid }
                  status: { type: string, enum: [ABANDONED] }
                  abandonedAt: { type: string, format: date-time, nullable: true }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: >
            Refused, and audited. OVERRIDE_SET_NOT_FOUND,
            OVERRIDE_SET_NOT_DRAFT or OVERRIDE_SET_REVISION_CONFLICT.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /cms/administrative-mappings:
    get:
      operationId: listAdministrativeMappings
      tags: [cms, administrative]
      summary: 'Moderation: places by administrative mapping status (ADM-009)'
      description: >
        The review queue. NEEDS_REVIEW and STALE are the actionable states — the
        ones where a person has something to decide — but nothing is hidden:
        every status is one filter away and all of them are in `counts`.


        `blockedApprovalOnly=true` is the view that matters most: places waiting
        for approval that cannot get it because of their mapping, including
        UNMAPPED ones. A place stuck on a mapping nobody can see is exactly the
        case a queue ordered by "what looks actionable" would bury.


        Cursor pagination orders by place id, not by `updated_at`: ordering by a
        column reviewers are changing would let a place they just touched jump
        pages under them.
      parameters:
        - name: status
          in: query
          description: Comma-separated mapping statuses.
          schema: { type: string, example: 'NEEDS_REVIEW,STALE' }
        - name: placeStatus
          in: query
          description: Comma-separated place statuses.
          schema: { type: string, example: 'review,community_submitted' }
        - name: blockedApprovalOnly
          in: query
          schema: { type: string, enum: ['true', 'false'] }
        - {
            name: limit,
            in: query,
            schema: { type: integer, minimum: 1, maximum: 200, default: 50 },
          }
        - { name: cursor, in: query, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: A page of mappings, with complete counts per status
          content:
            application/json:
              schema:
                type: object
                required: [items, nextCursor, counts]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/AdministrativeMappingListItem' }
                  nextCursor: { type: string, format: uuid, nullable: true }
                  counts:
                    type: object
                    additionalProperties: { type: integer }
                    description: One per mapping status plus `actionable`.
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /cms/administrative-mappings/remediation:
    get:
      operationId: getAdministrativeRemediation
      tags: [cms, administrative]
      summary: 'Moderation: approved places that would not pass the policy today'
      description: >
        Reporting only. Nothing here un-approves anything: these places were
        approved before the policy existed, and taking a working catalogue off
        the air to satisfy a rule written afterwards would do more harm than the
        gap it closes.


        `verified_against_older_version` is not a defect. The approval gate tests
        the identity — does this commune still exist, is it still current, does
        it still sit under this province — not the version string, because
        otherwise every publication would un-approve the catalogue. The category
        exists because "who verified this, and against what" is what a reviewer
        asks before deciding whether to look again.
      responses:
        '200':
          description: Counts per remediation category with bounded samples
          content:
            application/json:
              schema:
                type: object
                required: [activeDatasetVersion, counts, samples]
                properties:
                  activeDatasetVersion: { type: string }
                  counts:
                    type: object
                    required:
                      [
                        unmapped,
                        auto_matched,
                        needs_review,
                        rejected,
                        stale,
                        verified_against_older_version,
                        compliant,
                      ]
                    properties:
                      unmapped: { type: integer }
                      auto_matched: { type: integer }
                      needs_review: { type: integer }
                      rejected: { type: integer }
                      stale: { type: integer }
                      verified_against_older_version: { type: integer }
                      compliant: { type: integer }
                  samples:
                    type: object
                    additionalProperties:
                      type: array
                      items: { type: string, format: uuid }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /cms/places/{id}/administrative-mapping:
    get:
      operationId: getPlaceAdministrativeMapping
      tags: [cms, administrative]
      summary: 'Moderation: one mapping, its evidence and what may be done to it'
      description: >
        Everything the console needs on one screen, recomputed on read rather
        than served from a cache of what the resolver once thought: current
        codes and their resolved names, the resolver's evidence and alternative
        candidates, the unresolved reason, hierarchy validity, the staleness
        verdict, whether this mapping blocks approving the place and why, and
        which actions this role may take.


        The place's own address text, `city` and `district` are returned because
        a reviewer judges the mapping against what the address actually says.
        They are read here and never written by any endpoint in this group.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: The mapping and its evidence
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdministrativeMappingDetail' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/AdministrativeUnavailable' }

  /cms/places/{id}/administrative-mapping/verify:
    post:
      operationId: verifyPlaceAdministrativeMapping
      tags: [cms, administrative]
      summary: 'Moderation: a reviewer verifies these codes (ADM-009)'
      description: >
        The only path that writes VERIFIED. Inside the write transaction the
        server re-reads the place under a row lock, re-reads the *active*
        dataset, and checks that the province and commune are both current in it
        and that the commune belongs to the province — a code is not an
        identity, so the period is part of the check.


        No confidence number is written. A person's judgement is not a
        probability; VERIFIED plus their identity is the whole claim.


        `expectedUpdatedAt` is required: a reviewer decides about a row they saw,
        and a publication, another reviewer or a backfill can move it in
        between.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [provinceCode, communeCode, expectedUpdatedAt]
              properties:
                provinceCode: { type: string, pattern: '^[0-9]{2,5}$' }
                communeCode: { type: string, pattern: '^[0-9]{2,5}$' }
                legacyDistrictCode:
                  type: string
                  pattern: '^[0-9]{2,5}$'
                  nullable: true
                  description: Pre-2025-07-01 evidence. Checked against the historical set.
                note: { type: string, maxLength: 500 }
                expectedUpdatedAt: { type: string, format: date-time }
      responses:
        '201':
          description: The mapping is verified
          content:
            application/json:
              schema:
                type: object
                required: [placeId, status, datasetVersion]
                properties:
                  placeId: { type: string, format: uuid }
                  status: { type: string, enum: [VERIFIED] }
                  datasetVersion: { type: string }
        '400':
          description: >
            PROVINCE_NOT_CURRENT, COMMUNE_NOT_CURRENT, HIERARCHY_INVALID or
            LEGACY_DISTRICT_UNKNOWN — the selection does not describe a real
            unit in the active dataset.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: PLACE_MODIFIED — the place changed since it was read.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /cms/places/{id}/administrative-mapping/reject:
    post:
      operationId: rejectPlaceAdministrativeMapping
      tags: [cms, administrative]
      summary: 'Moderation: reject the mapping — not the place (ADM-009)'
      description: >
        Rejecting a mapping says this answer is wrong. It does not touch the
        place's own moderation state, its address, or its geometry; it blocks
        approval until somebody produces a mapping that is right.


        The rejected codes and the resolver's evidence are kept on the record,
        because what was rejected is the most useful thing the next reviewer can
        be told.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AdministrativeMappingReason' }
      responses:
        '201':
          description: The mapping is rejected
          content:
            application/json:
              schema:
                type: object
                required: [placeId, status]
                properties:
                  placeId: { type: string, format: uuid }
                  status: { type: string, enum: [REJECTED] }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /cms/places/{id}/administrative-mapping/rematch:
    post:
      operationId: rematchPlaceAdministrativeMapping
      tags: [cms, administrative]
      summary: 'Moderation: re-run the resolver on one rejected mapping (ADM-009)'
      description: >
        The only route that reopens a REJECTED mapping — one place, a reason, and
        an authenticated person to attribute it to. The bulk backfill (#461) has
        no such option, because it has nobody to name.


        Asking for a rematch is not verifying anything. The resolver's answer is
        written under the ordinary transition rules, the previous reviewer's
        attribution is cleared because their decision no longer stands, and the
        requester is recorded in the audit as the requester — never in
        `administrative_mapped_by`.


        A VERIFIED mapping is refused: correcting one is an explicit reviewer
        act that names both people, not a re-derivation.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AdministrativeMappingReason' }
      responses:
        '201':
          description: The resolver ran and its result was persisted
          content:
            application/json:
              schema:
                type: object
                required: [placeId, status, communeCode]
                properties:
                  placeId: { type: string, format: uuid }
                  status:
                    type: string
                    enum: [UNMAPPED, AUTO_MATCHED, NEEDS_REVIEW]
                  communeCode: { type: string, nullable: true }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: VERIFIED_NOT_REMATCHABLE, or PLACE_MODIFIED.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /cms/places/{id}/administrative-mapping/correct:
    post:
      operationId: correctPlaceAdministrativeMapping
      tags: [cms, administrative]
      summary: 'Moderation: correct a mapping somebody already verified (ADM-009)'
      description: >
        Separate from verify on purpose. Changing a decision a person recorded is
        an act that must name both of them, and the audit row does: the previous
        reviewer, their codes, the corrector, the reason, and the new codes.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [provinceCode, communeCode, reason, expectedUpdatedAt]
              properties:
                provinceCode: { type: string, pattern: '^[0-9]{2,5}$' }
                communeCode: { type: string, pattern: '^[0-9]{2,5}$' }
                legacyDistrictCode: { type: string, pattern: '^[0-9]{2,5}$', nullable: true }
                reason: { type: string, minLength: 1, maxLength: 500 }
                expectedUpdatedAt: { type: string, format: date-time }
      responses:
        '201':
          description: The mapping is corrected and re-verified
          content:
            application/json:
              schema:
                type: object
                required: [placeId, status, datasetVersion]
                properties:
                  placeId: { type: string, format: uuid }
                  status: { type: string, enum: [VERIFIED] }
                  datasetVersion: { type: string }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: NOT_VERIFIED, or PLACE_MODIFIED.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /cms/places/{id}/administrative-mapping/reconcile:
    post:
      operationId: reconcilePlaceAdministrativeMapping
      tags: [cms, administrative]
      summary: 'Ops: re-evaluate one mapping against the active dataset (ADM-009)'
      description: >
        System reconciliation, and `ops_admin` rather than `moderator` because it
        belongs to whoever published the dataset that changed — and because it is
        emphatically not a verification.


        A version change alone never makes a mapping stale. If the same commune
        still exists, is still current and still sits under the same province,
        nothing is written and the older version stays as provenance. When the
        identity really has failed, STALE is written and the codes and
        `administrative_mapped_by` are **kept**: that column names who verified
        the stored mapping, and they did — STALE says that verification is no
        longer current. The audit row names the reconciler separately, so the log
        can never be read as "this person verified it".


        Idempotent: reconciling an already-stale mapping writes nothing.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '201':
          description: The verdict, and whether anything was written
          content:
            application/json:
              schema:
                type: object
                required: [placeId, changed, verdict]
                properties:
                  placeId: { type: string, format: uuid }
                  changed: { type: boolean }
                  verdict: { $ref: '#/components/schemas/AdministrativeStaleVerdict' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /taxonomies:
    get:
      operationId: listTaxonomies
      tags: [preferences]
      summary: Stable taxonomy keys + i18n labels (clients never hard-code ids)
      security: []
      parameters:
        - name: kinds
          in: query
          schema: { type: string }
          description: Comma-separated kind filter (mood,category,setting,dietary,accessibility,spending_style,suitability,checkin_tag)
      responses:
        '200':
          description: Taxonomy keys with i18n labels
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TaxonomyList' }

  /places/search:
    get:
      operationId: searchPlaces
      tags: [places]
      summary: Place search — Vietnamese-normalized text, filters, ranking, cursor
      description: >
        FR-SEARCH-001..004/009 + SE-010. Accent-insensitive FTS + trigram typo
        tolerance + synonym expansion; hard filters in SQL; weighted versioned
        ranking (meta.weightsVersion); stable keyset cursor. Lodging excluded
        unless requested. Zero-results emit telemetry without raw PII.
      security: []
      parameters:
        - { name: q, in: query, schema: { type: string, maxLength: 200 } }
        - { name: lat, in: query, schema: { type: number } }
        - { name: lng, in: query, schema: { type: number } }
        - { name: radiusM, in: query, schema: { type: integer, minimum: 100, maximum: 100000 } }
        - { name: openAt, in: query, schema: { type: string }, description: "'now' or ISO-8601" }
        - { name: categories, in: query, schema: { type: string }, description: CSV, multi-select }
        - { name: suitedFor, in: query, schema: { type: string, enum: [couple, group, family] } }
        - { name: priceMinPerPerson, in: query, schema: { type: integer, minimum: 0 } }
        - { name: priceMaxPerPerson, in: query, schema: { type: integer, minimum: 0 } }
        - { name: minRating, in: query, schema: { type: number, minimum: 0, maximum: 5 } }
        - { name: dietary, in: query, schema: { type: string }, description: CSV, ALL required }
        - {
            name: accessibility,
            in: query,
            schema: { type: string },
            description: CSV,
            ALL required,
          }
        - { name: includeLodging, in: query, schema: { type: boolean } }
        - name: sort
          in: query
          schema:
            {
              type: string,
              enum: [relevance, distance, rating, price, curated],
              default: relevance,
            }
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Ranked results with reason codes and open/price facts
          content:
            application/json:
              schema:
                type: object
                required: [results, nextCursor, meta]
                properties:
                  results:
                    type: array
                    items: { $ref: '#/components/schemas/PlaceSearchResult' }
                  nextCursor: { type: [string, 'null'] }
                  meta:
                    type: object
                    properties:
                      weightsVersion: { type: string }
                      sort: { type: string }
        '400': { $ref: '#/components/responses/BadRequest' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /places/{id}:
    get:
      operationId: getPlaceDetail
      tags: [places]
