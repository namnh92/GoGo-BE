        '400': { $ref: '#/components/responses/BadRequest' }

  /places/imports:
    post:
      operationId: submitPlaceImport
      tags: [places]
      summary: Submit a Google Maps link for verification (FR-PLACE-001..005)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [url]
              properties:
                url: { type: string, format: uri, maxLength: 2000 }
                roomId: { type: string, format: uuid }
      responses:
        '201':
          description: >
            Import result: pending → verified | rejected. Rejections carry a
            stable reasonCode (NOT_FOUND, INSUFFICIENT_REVIEWS, LOW_RATING,
            OUT_OF_AREA, CLOSED, INVALID_URL, PROVIDER_ERROR,
            IDENTITY_CONFLICT). IDENTITY_CONFLICT means the Google Place ID is
            recorded against two GoGo places and an editor must merge them
            first — linking to either would be the API picking a winner.
        '400': { $ref: '#/components/responses/BadRequest' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /places/imports/{importId}:
    get:
      operationId: getPlaceImport
